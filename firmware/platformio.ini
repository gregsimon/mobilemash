; Shared settings for every build target.
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@^3.0.6

; ---------- ESP32 DevKit (original target) ----------
[env:esp32]
board = esp32dev
upload_port = /dev/ttyUSB1
build_flags = -D BOARD_ESP32_DEVKIT

; ---------- Seeed XIAO ESP32-C6 ----------
; The ESP32-C6 needs Arduino core 3.x, which the stock espressif32 platform
; does not bundle. Use the pioarduino platform fork for this target only; the
; DevKit env above stays on the stock platform so it keeps building as before.
[env:seeed]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c6
build_flags = -D BOARD_XIAO_ESP32C6
